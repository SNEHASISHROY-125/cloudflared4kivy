
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflared"
version = "1.4.0"
authors = [
  { name="SNEHASYS TECHNOLOGIES", email="info@snehasish.in" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE*"]
description = "Cloudflared bridge for Kivy Android applications"
requires-python = ">=3.9"
dependencies = [
    "pyjnius",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudflared*"]